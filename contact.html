<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishShield - Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-accent: #a3e635;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-light: #ffffff;
            --text-dim: #cbd5e1;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Poppins', sans-serif; 
        }

        body { 
            color: var(--text-light); 
            min-height: 100vh; 
            background-color: #0f172a; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            overflow-x: hidden;
        }
        
        .bg-image {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-image: url('1.png'); 
            background-size: cover; 
            background-position: center;
            filter: blur(8px) brightness(0.65); 
            transform: scale(1.05); 
            z-index: -1;
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 5%; 
            width: 100%; 
        }

        .brand-name { 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 800; 
            font-size: 1.4rem; 
            color: #fff; 
            text-decoration: none; 
        }

        nav ul { 
            display: flex; 
            list-style: none; 
            gap: 20px; 
        }

        nav a { 
            color: var(--text-dim); 
            text-decoration: none; 
            font-size: 0.95rem; 
            transition: 0.3s; 
        }

        nav a:hover, nav a.active { 
            color: #fff; 
            border-bottom: 2px solid var(--primary-accent); 
        }

        .header-date { 
            font-size: 0.85rem; 
            color: var(--text-dim); 
        }

        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 30px 15px 60px; 
            width: 100%;
        }
        
        .content-card {
            background: var(--glass-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); 
            border-radius: 16px;
            padding: 35px; 
            width: 100%; 
            max-width: 800px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            text-align: left;
            word-wrap: break-word;
        }

        .content-card h1 { 
            font-family: 'Montserrat', sans-serif; 
            color: var(--primary-accent); 
            font-size: clamp(1.5rem, 5vw, 2rem); 
            margin-bottom: 20px; 
            border-bottom: 1px solid var(--glass-border); 
            padding-bottom: 10px; 
        }

        .info-group { 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            font-size: 1.05rem; 
            color: var(--text-dim); 
        }

        .info-group i { 
            color: var(--primary-accent); 
            font-size: 1.3rem; 
            width: 25px;
            text-align: center;
        }

        footer { 
            padding: 20px; 
            text-align: center; 
            font-size: 0.8rem; 
            color: var(--text-dim); 
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            header { 
                flex-direction: column; 
                gap: 15px; 
                padding: 20px 15px; 
                text-align: center;
            }

            nav ul { 
                gap: 15px; 
            }

            nav a { 
                font-size: 0.85rem; 
            }

            .header-date { 
                display: none; 
            }

            .content-card { 
                padding: 20px; 
            }

            .info-group {
                font-size: 0.9rem;
                gap: 10px;
            }

            .info-group i {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>

    <header>
        <a href="index.html" class="brand-name">PhishShield</a>
        <nav>
            <ul>
                <li><a href="about.html">About Us</a></li>
                <li><a href="project.html">Project</a></li>
                <li><a href="index.html">Analyzer</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
        <div class="header-date">SECURITY TOOLS</div>
    </header>

    <main>
        <div class="content-card">
            <h1>CONTACT RESEARCHER</h1>
            <div class="info-group">
                <i class="fa-solid fa-user"></i>
                <span><strong>Developer:</strong> YASIR ARAFAT NOMAN</span>
            </div>
            <div class="info-group">
                <i class="fa-solid fa-graduation-cap"></i>
                <span><strong>Domain:</strong> Cyber Security & Policy Analysis</span>
            </div>
            <div class="info-group">
                <i class="fa-solid fa-envelope"></i>
                <span><strong>Email:</strong> 25-62579-2@student.aiub.edu</span>
            </div>
        </div>
    </main>

    <footer>Developed by Noman</footer>
</body>
</html>
